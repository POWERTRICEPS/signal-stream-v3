services:
  postgres:
    image: postgres:16
    container_name: signal-stream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: signal_user
      POSTGRES_PASSWORD: signal_password
      POSTGRES_DB: signal_stream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: signal-stream-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:

